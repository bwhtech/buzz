{# Section chrome shared by the home and category pages. #}

{% macro section_header(title, heading_id=None) %}
<h2 class="section-heading mb-4"{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ title }}</h2>
{% endmacro %}

{% macro view_all_link(href, link_label="View all") %}
<a href="{{ href }}" class="view-all mt-4">{{ link_label }} <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>
{% endmacro %}
