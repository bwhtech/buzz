<a href="{{ event.recap_url if (event.is_past and event.recap_url) else ('/events/' ~ event.route) }}" class="event-card {% if event.is_past %}is-past{% endif %}" aria-label="{{ event.title }}">
  <div class="event-card__media">
    {% if event.image %}
    <img src="{{ event.image }}" alt="" loading="lazy" />
    {% else %}
    <div style="height:180px; display:flex; align-items:center; justify-content:center; background: var(--swatch-{{ event.swatch | default('yellow') }}); font-family: 'Caveat', cursive; font-size: 56px; color: var(--accent);">&#9733;</div>
    {% endif %}
    {% if event.date_short %}<span class="event-card__date">{{ event.date_short }}</span>{% endif %}
  </div>
  <div class="event-card__body">
    <h3 class="event-card__title">{{ event.title }}</h3>
    {% if event.venue_short %}
    <div class="event-card__venue">
      <i data-lucide="map-pin"></i>
      <span>{{ event.venue_short }}</span>
    </div>
    {% endif %}
    <div class="event-card__meta">
      <span class="label">{{ event.category_label }}</span>
      <span class="event-card__cta">{% if event.is_past %}recap &rarr;{% else %}ticket &rarr;{% endif %}</span>
    </div>
  </div>
</a>
