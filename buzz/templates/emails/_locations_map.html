<div style="margin-top:28px;padding-top:24px;border-top:1px solid #ededed">
  <div style="font-size:11px;font-weight:600;letter-spacing:0.06em;color:#7c7c7c;margin:0 0 12px">WHERE · {{ event_header.locations | length }} LOCATIONS</div>
  {% if event_header.locations_map_url %}
  {% set map_image %}<img src="{{ event_header.locations_map_url }}" alt="Map of the {{ event_header.locations | length }} locations" width="488" style="display:block;width:100%;height:auto;border:1px solid #e2e2e2;border-radius:8px" />{% endset %}
  {% if event_header.locations_url %}<a href="{{ event_header.locations_url | e }}" style="display:block;text-decoration:none">{{ map_image }}</a>{% else %}{{ map_image }}{% endif %}
  {% endif %}
  <div style="margin-top:4px">{% include "buzz/templates/emails/_location_rows.html" %}</div>
</div>
