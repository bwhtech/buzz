name: Dashboard Unit Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

concurrency:
  group: unit-tests-buzz-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: ./.github/actions/detect-code-changes

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than lts/*: the tests are .ts files run straight through
      # node --test, which relies on the runtime's type stripping.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: dashboard/yarn.lock

      - name: Install dependencies
        working-directory: dashboard
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        working-directory: dashboard
        run: yarn test:unit
