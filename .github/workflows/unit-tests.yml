name: Dashboard Unit Tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

concurrency:
  group: unit-tests-buzz-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04

    steps:
      # The dashboard links @framework/ui from the frappe app beside it, as on a bench.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: apps/buzz

      - name: Checkout @framework/ui
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          path: apps/frappe
          sparse-checkout: ui

      # Pinned rather than lts/*: the tests are .ts files run straight through
      # node --test, which relies on the runtime's type stripping.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: apps/buzz/dashboard/yarn.lock

      - name: Install dependencies
        working-directory: apps/buzz/dashboard
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        working-directory: apps/buzz/dashboard
        run: yarn test:unit
