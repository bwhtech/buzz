name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  merge_group:

concurrency:
  group: ci-buzz-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: ./.github/actions/detect-code-changes

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    env:
      PYTHONWARNINGS: ignore

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=2s --health-retries=3
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Bench
        uses: ./.github/actions/setup-bench
        with:
          # test_buzz_event imports zoom_integration.tests.zoom_fixtures.
          extra-app-url: https://github.com/bwhtech/zoom_integration

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app buzz
        env:
          TYPE: server
