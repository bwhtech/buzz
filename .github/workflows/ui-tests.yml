name: UI Tests

on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  merge_group:
  workflow_dispatch:

concurrency:
  group: ui-tests-buzz-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Playwright E2E Tests

    env:
      PYTHONWARNINGS: ignore

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=2s --health-retries=3
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}

      - name: Setup Bench
        uses: ./.github/actions/setup-bench
        with:
          site-name: buzz.test
          build-assets: true

      - name: Create Test User
        working-directory: /home/runner/frappe-bench
        run: >-
          bench --site buzz.test add-user testuser@buzz.test
          --first-name Test --last-name User --password Test@123
          --add-role "System Manager"

      - name: Start Frappe Server
        working-directory: /home/runner/frappe-bench
        run: |
          bench start &> bench_start.log &
          timeout 60 bash -c \
            'until curl -sf http://buzz.test:8000 > /dev/null; do sleep 1; done'

      - name: Install Playwright
        run: |
          # --ignore-scripts skips the postinstall that reinstalls the whole
          # dashboard tree; the tests only need @playwright/test.
          yarn install --frozen-lockfile --ignore-scripts
          npx playwright install --with-deps --only-shell chromium

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          BASE_URL: http://buzz.test:8000
          FRAPPE_USER: testuser@buzz.test
          FRAPPE_PASSWORD: Test@123

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Show Bench Logs on Failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          echo "=== Bench Start Log ==="
          cat bench_start.log || true
          echo ""
          echo "=== Frappe Logs ==="
          cat logs/*.log || true
