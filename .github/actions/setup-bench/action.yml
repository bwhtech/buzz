name: "Setup Bench"
description: "Provisions a bench with buzz installed on a fresh site"

inputs:
  site-name:
    description: "Site to create. Also used as the /etc/hosts entry and host_name."
    required: false
    default: "test_site"
  build-assets:
    description: "Run `bench build`. Needed by jobs that hit the UI or check the build."
    required: false
    default: "false"
  extra-app-url:
    description: "Git URL of one more app to install before buzz. App name is the last path segment."
    required: false
    default: ""
  frappe-branch:
    description: "Branch of frappe and payments to install. Empty uses each repo's default branch."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Add site to hosts
      shell: bash -e {0}
      run: echo "127.0.0.1 ${{ inputs.site-name }}" | sudo tee -a /etc/hosts

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - uses: actions/setup-node@v4
      if: inputs.build-assets == 'true'
      with:
        node-version: "24"
        cache: yarn
        cache-dependency-path: dashboard/yarn.lock

    - name: Skip yarn installs
      if: inputs.build-assets != 'true'
      shell: bash -e {0}
      run: |
        # bench runs `yarn install` for every app even with --skip-assets, and nothing here
        # builds assets. A no-op yarn saves the installs and the Node 24 requirement.
        shim="${RUNNER_TEMP}/yarn-shim"
        mkdir -p "$shim"
        printf '#!/bin/sh\necho "yarn $* skipped: assets are not built"\n' > "$shim/yarn"
        chmod +x "$shim/yarn"
        echo "$shim" >> "$GITHUB_PATH"

    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: |
          **/pyproject.toml
          **/requirements*.txt

    - name: Install bench and the MariaDB client
      shell: bash -e {0}
      run: |
        # The MariaDB service container already ships the client, so run it there
        # instead of installing mariadb-client from apt, whose mirror can stall for
        # minutes. Frappe pipes SQL to `mariadb --host=127.0.0.1 --port=3306`, which
        # inside the container reaches the same server.
        container=$(docker ps --quiet --filter publish=3306)
        shim="${RUNNER_TEMP}/mariadb-shim"
        mkdir -p "$shim"
        printf '#!/bin/sh\nexec docker exec -i %s mariadb "$@"\n' "$container" > "$shim/mariadb"
        chmod +x "$shim/mariadb"
        echo "$shim" >> "$GITHUB_PATH"

        uv tool install frappe-bench

    - name: Init bench
      shell: bash -e {0}
      env:
        FRAPPE_BRANCH: ${{ inputs.frappe-branch }}
      run: |
        bench init ~/frappe-bench \
          ${FRAPPE_BRANCH:+--frappe-branch "$FRAPPE_BRANCH"} \
          --skip-redis-config-generation \
          --skip-assets \
          --no-backups \
          --python "$(which python)"

        cd ~/frappe-bench

        # socketio stays: the dashboard opens a socket on boot (dashboard/src/main.ts).
        sed -i '/^watch:/d;/^schedule:/d' Procfile

    - name: Get apps
      shell: bash -e {0}
      working-directory: /home/runner/frappe-bench
      env:
        EXTRA_APP_URL: ${{ inputs.extra-app-url }}
        FRAPPE_BRANCH: ${{ inputs.frappe-branch }}
      run: |
        # buzz lists frappe/payments in required_apps, so it must precede install-app.
        bench get-app --skip-assets ${FRAPPE_BRANCH:+--branch "$FRAPPE_BRANCH"} https://github.com/frappe/payments

        # Test-only: buzz/tests/factories imports frappe_factory_bot. No install-app —
        # the app ships no DocTypes, and get-app already pip-installs it into the env.
        # Pinned to a reviewed commit: the repo has no tags and `bench get-app --branch`
        # rejects a SHA, so clone and check out before handing bench the local path.
        git clone https://github.com/harshtandiya/frappe_factory_bot /tmp/frappe_factory_bot
        git -C /tmp/frappe_factory_bot checkout 48904d0df778513934e92a4e7663c74bfe31bc56
        bench get-app --skip-assets /tmp/frappe_factory_bot

        if [ -n "$EXTRA_APP_URL" ]; then
          bench get-app --skip-assets "$EXTRA_APP_URL"
        fi

        bench get-app --skip-assets buzz "$GITHUB_WORKSPACE"

    - name: Install requirements
      shell: bash -e {0}
      working-directory: /home/runner/frappe-bench
      env:
        BUILD_ASSETS: ${{ inputs.build-assets }}
      run: |
        # `--dev` installs only python dev deps and `--node` only runs yarn, so
        # they share nothing. App requirements came from `bench get-app`.
        bench setup requirements --dev &
        dev_pid=$!

        if [ "$BUILD_ASSETS" == "true" ]; then
          bench setup requirements --node
        fi

        wait "$dev_pid"

    - name: Create site
      shell: bash -e {0}
      working-directory: /home/runner/frappe-bench
      env:
        BUILD_ASSETS: ${{ inputs.build-assets }}
        EXTRA_APP_URL: ${{ inputs.extra-app-url }}
        SITE: ${{ inputs.site-name }}
      run: |
        # The build is CPU-bound and the site is DB-bound; they share no state.
        build_pid=""
        if [ "$BUILD_ASSETS" == "true" ]; then
          CI=Yes bench build &> "${RUNNER_TEMP}/build.log" &
          build_pid=$!
        fi

        # The CI database is discarded at the end of the job, so crash safety buys
        # nothing. `root` must match MARIADB_ROOT_PASSWORD on the caller's service.
        mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "
          SET GLOBAL innodb_flush_log_at_trx_commit = 0;
          SET GLOBAL sync_binlog = 0;"

        bench new-site --db-root-password root --admin-password admin "$SITE"

        if [ -n "$EXTRA_APP_URL" ]; then
          bench --site "$SITE" install-app "$(basename "$EXTRA_APP_URL" .git)"
        fi

        bench --site "$SITE" install-app buzz

        bench --site "$SITE" set-config allow_tests true
        bench --site "$SITE" set-config host_name "http://$SITE:8000"

        if [ -n "$build_pid" ] && ! wait "$build_pid"; then
          echo "Asset build failed:"
          cat "${RUNNER_TEMP}/build.log"
          exit 1
        fi
