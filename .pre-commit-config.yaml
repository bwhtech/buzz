exclude: "node_modules|.git"
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "buzz.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.80.0
    hooks:
      - id: oxlint
        args: ["--deny-warnings"]
        types_or: [javascript, jsx, ts, tsx, vue]
        # Ignore any files that might contain jinja / bundles
        exclude: &oxc_exclude |
          (?x)^(
              buzz/public/dist/.*|
              buzz/public/dashboard/.*|
              .*node_modules.*|
              .*boilerplate.*|
              buzz/templates/includes/.*|
              buzz/public/js/lib/.*
          )$

  - repo: https://github.com/oxc-project/mirrors-oxfmt
    rev: v0.65.0
    hooks:
      - id: oxfmt
        types_or: [javascript, jsx, ts, tsx, vue]
        exclude: *oxc_exclude

  - repo: local
    hooks:
      # Catches type errors before CI does. Runs on push, not commit, to keep commits fast.
      - id: dashboard-typecheck
        name: "Type check the dashboard"
        entry: bash -c 'cd dashboard && yarn typecheck'
        language: system
        pass_filenames: false
        files: ^(dashboard/|buzz/public/js/)
        stages: [pre-push]

ci:
  autoupdate_schedule: weekly
  # Needs the dashboard's node_modules.
  skip: [dashboard-typecheck]
  submodules: false
